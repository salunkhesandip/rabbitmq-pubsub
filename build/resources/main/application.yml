spring:
  application:
    name: rabbitmq-pubsub

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: /
    listener:
      simple:
        # Acknowledge messages only after the listener method returns successfully
        acknowledge-mode: auto
        # Retry failed messages up to 3 times before dead-lettering
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000
          multiplier: 2.0
          max-interval: 10000

server:
  port: 8084

logging:
  level:
    com.cleancoders.rabbitmqpubsub: DEBUG
    org.springframework.amqp: INFO
